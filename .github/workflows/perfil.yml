name: Actualizar perfil

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "perfil/**"
      - ".github/workflows/perfil.yml"

permissions:
  contents: write

concurrency:
  group: actualizar-perfil
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install --quiet pyyaml

      - name: Generar sección de proyectos
        env:
          GH_TOKEN: ${{ secrets.PERFIL_TOKEN }}
        run: python perfil/generar.py

      - name: Guardar cambios
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Actualizar proyectos"
          git push
